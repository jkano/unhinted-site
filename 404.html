<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unhinted</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0C1F">
<script>
/* Language, as on every page: a choice made with the EN/ES button wins, then the browser's first English or Spanish language.
   Spanish addresses start with /es/ (so /es/j/K7MQ4P is the Spanish join page). Any other address is English unless it is redirected. */
(function(){var l;try{l=localStorage.getItem('lang')}catch(e){}
if(l!=='es'&&l!=='en'){l='en';var n=navigator.languages||[navigator.language||'en'];for(var i=0;i<n.length;i++){if(/^es/i.test(n[i])){l='es';break}if(/^en/i.test(n[i])){break}}}
if(l==='es'&&!/^\/es(\/|$)/.test(location.pathname))location.replace('/es'+location.pathname+location.search+location.hash)})();
</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/lang.js" defer></script>
</head>
<body>
<!-- GitHub Pages serves this one file for any address that does not exist, in both languages, so it also answers share links
     such as /j/K7MQ4P and /es/j/K7MQ4P. When Universal Links are set up (R3), the phone opens the app instead of this page. -->
<header class="doc-head">
<div class="wrap">
<div class="top">
<a class="brand" id="brand" href="/">unhinted</a>
<nav class="nav" id="nav" aria-label="Main"><a id="home" href="/">← Home</a><span class="lang" id="langs" role="group" aria-label="Language"><a id="langen" href="/" hreflang="en" data-lang="en" aria-current="true">EN</a><a id="langes" href="/es/" hreflang="es" data-lang="es">ES</a></span></nav>
</div>
</div>
</header>

<main class="join">
<div class="wrap">
<div class="box" id="join" hidden>
<div class="bars" aria-hidden="true" style="--h:56px"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<h1 id="joinTitle"></h1>
<span class="code" id="code" aria-label="Room code"></span>
<p id="joinText1"></p>
<p id="joinText2"></p>
<a id="what" href="/" style="font-weight:900"></a>
</div>
<div class="box" id="missing" hidden>
<h1 id="missingTitle"></h1>
<p id="missingText"></p>
<a id="goHome" href="/" style="font-weight:900"></a>
</div>
</div>
</main>

<script>
(function () {
  var TEXT = {
    en: {
      back: '← Home', nav: 'Main', langs: 'Language', roomCode: 'Room code', joinDoc: 'Join a room · Unhinted',
      joinTitle: "You're invited to a room",
      joinText1: 'Open Unhinted on your iPhone and type this code on Home to join.',
      joinText2: '<b>Unhinted is coming soon to the App Store.</b> If you already have the app, tap Paste on Home after copying the code.',
      what: 'What is Unhinted?',
      missingTitle: 'This page does not exist', missingText: 'The address may be wrong or old.', goHome: 'Go to the home page'
    },
    es: {
      back: '← Inicio', nav: 'Principal', langs: 'Idioma', roomCode: 'Código de la sala', joinDoc: 'Entra a una sala · Unhinted',
      joinTitle: 'Te invitaron a una sala',
      joinText1: 'Abre Unhinted en tu iPhone y escribe este código en Inicio para entrar.',
      joinText2: '<b>Unhinted llegará pronto a la App Store.</b> Si ya tienes la app, toca Pegar en Inicio después de copiar el código.',
      what: '¿Qué es Unhinted?',
      missingTitle: 'Esta página no existe', missingText: 'La dirección puede estar mal escrita o ser antigua.', goHome: 'Ir a la página de inicio'
    }
  };
  var path = location.pathname;
  var es = /^\/es(\/|$)/.test(path);
  var lang = es ? 'es' : 'en', T = TEXT[lang], prefix = es ? '/es' : '';
  var plain = es ? (path.replace(/^\/es/, '') || '/') : path;       // the same address in English
  var $ = function (id) { return document.getElementById(id); };

  document.documentElement.lang = lang;
  $('brand').href = prefix + '/';
  $('home').href = prefix + '/'; $('home').textContent = T.back;
  $('nav').setAttribute('aria-label', T.nav); $('langs').setAttribute('aria-label', T.langs);
  $('langen').href = plain; $('langes').href = '/es' + (plain === '/' ? '/' : plain);
  var cur = es ? $('langes') : $('langen');
  $('langen').removeAttribute('aria-current'); $('langes').removeAttribute('aria-current'); cur.setAttribute('aria-current', 'true');
  $('code').setAttribute('aria-label', T.roomCode);

  var m = plain.match(/^\/j\/([A-Za-z0-9]{6})\/?$/);
  if (m) {
    $('code').textContent = m[1].toUpperCase().replace(/^(...)(...)$/, '$1 $2');
    $('joinTitle').textContent = T.joinTitle;
    $('joinText1').textContent = T.joinText1;
    $('joinText2').innerHTML = T.joinText2;
    $('what').textContent = T.what; $('what').href = prefix + '/';
    $('join').hidden = false;
    document.title = T.joinDoc;
  } else {
    $('missingTitle').textContent = T.missingTitle;
    $('missingText').textContent = T.missingText;
    $('goHome').textContent = T.goHome; $('goHome').href = prefix + '/';
    $('missing').hidden = false;
  }
})();
</script>
</body>
</html>
